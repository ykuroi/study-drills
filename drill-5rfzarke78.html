const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));const K="enc_pw_"+S.slice(0,8);
async function open(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(D));const h=new TextDecoder().decode(pt);
return h;}
function show(h){document.open();document.write(h);document.close();}
const f=document.getElementById('f'),e=document.getElementById('err'),g=document.getElementById('go');
f.onsubmit=async ev=>{ev.preventDefault();const pw=document.getElementById('pw').value;g.disabled=true;g.textContent='確認中…';
try{const rem=document.getElementById('rem').checked;const h=await open(pw);try{if(rem)localStorage.setItem(K,pw)}catch(_){}show(h);}
catch(_){e.textContent=(window.crypto&&crypto.subtle)?'パスワードが違います':'このブラウザ・開き方では復号できません。https のアドレスで開いてください';g.disabled=false;g.textContent='開く';}};
